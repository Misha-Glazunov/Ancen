global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики контейнеров (CPU/память/сеть/диск на каждый сервис compose)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики MySQL (соединения, запросы, репликация и т.д.)
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
