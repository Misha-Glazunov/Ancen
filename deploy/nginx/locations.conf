# Общие location-блоки, подключаются из server{80} и server{443} в nginx.conf
# через include — чтобы правила не разъезжались между HTTP и HTTPS.

location /ws {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
}

location ~ ^/(login|register|forgot-password) {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Загрузка видео ждёт синхронного ffmpeg-транскодинга (adminUploadVideoHandler
# в main.go) прежде чем ответить — дефолтный proxy_read_timeout (60s) обрывал
# соединение на любом видео длиннее пары минут, браузер получал "ошибка
# загрузки видео" при живом ffmpeg-процессе на сервере.
location /api/admin/upload-video {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
