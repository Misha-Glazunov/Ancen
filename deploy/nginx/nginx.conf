worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2g; # совпадает с maxUploadBytes в cmd/server/main.go

    # Глобальный rate limit (ТЗ, раздел "Защита от атак"): приложение уже
    # лимитирует логин/регистрацию по логин+IP в коде, это — грубый защитный
    # слой перед ним на уровне прокси.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream app {
        server app:8080;
    }

    # Диапазоны Cloudflare (https://www.cloudflare.com/ips/). Используются и для
    # real_ip (в логах реальный IP посетителя из CF-Connecting-IP), и для
    # allow/deny в server{443} — прямой запрос на origin в обход Cloudflare
    # отклоняется. Список тот же, что cloudflareCIDRs в cmd/server/main.go —
    # держать синхронно при обновлении.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    geo $cloudflare_ip {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    # Порт 80 — точка входа для Cloudflare Tunnel (cloudflared -> nginx:80,
    # внутри compose-сети). Провайдер режет входящие 80/443 снаружи напрямую,
    # поэтому здесь редиректа на HTTPS нет: тоннель ходит по HTTP внутри Docker.
    # После перехода на статический IP + прямой proxied (см. Obsidian
    # 23_План_переход_на_статический_IP) и удаления cloudflared этот блок
    # станет редиректом на 443.
    server {
        listen 80;
        include /etc/nginx/locations.conf;
    }

    # Порт 443 — origin для Cloudflare в режиме proxied. Снаружи доступен через
    # проброс роутера: внешний 8443 -> 443 (обход DPI провайдера на 80/443).
    # Cloudflare ходит сюда по HTTPS с Origin-сертификатом; прямые запросы в
    # обход Cloudflare отклоняются по $cloudflare_ip.
    server {
        listen 443 ssl;
        http2 on;
        server_name animemory.ru cdn.animemory.ru;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($cloudflare_ip = 0) {
            return 403;
        }

        include /etc/nginx/locations.conf;
    }
}
