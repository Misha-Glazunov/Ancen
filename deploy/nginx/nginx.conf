worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2g; # совпадает с maxUploadBytes в cmd/server/main.go

    # Глобальный rate limit (ТЗ, раздел "Защита от атак"): приложение уже
    # лимитирует логин/регистрацию по логин+IP в коде, это — грубый защитный
    # слой перед ним на уровне прокси.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream app {
        server app:8080;
    }

    # Docker Desktop на Windows NAT-ит published-порты: до контейнера трафик
    # доходит от шлюза бриджа (172.x.0.1), реального src-IP не видно. Поэтому:
    #  - real_ip доверяем docker-бриджу (единственный хоп между Cloudflare и
    #    nginx), реальный IP посетителя берём из CF-Connecting-IP;
    #  - фильтровать origin по диапазонам Cloudflare (geo $remote_addr)
    #    невозможно — peer всегда 172.x. Замена — проверка наличия заголовка
    #    CF-Connecting-IP ниже.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Origin-lock: Cloudflare всегда добавляет CF-Connecting-IP, прямой запрос
    # на :8443 в обход CF — нет.
    # ponytail: заголовок можно подделать, зная origin-IP+порт. Потолок принят;
    # апгрейд — Authenticated Origin Pulls (mTLS) в Cloudflare SSL/TLS -> Origin
    # Server, тогда origin требует клиентский серт CF.
    map $http_cf_connecting_ip $from_cloudflare {
        ""      0;
        default 1;
    }

    # Порт 80 — точка входа для Cloudflare Tunnel (cloudflared -> nginx:80,
    # внутри compose-сети). Провайдер режет входящие 80/443 снаружи напрямую,
    # поэтому здесь редиректа на HTTPS нет: тоннель ходит по HTTP внутри Docker.
    # После удаления cloudflared этот блок станет редиректом на 443.
    server {
        listen 80;
        include /etc/nginx/locations.conf;
    }

    # Порт 443 — origin для Cloudflare в режиме proxied. Снаружи доступен через
    # проброс роутера: внешний 8443 -> 443 (обход DPI провайдера на 80/443).
    # HTTP/2 на origin НЕ включаем: Cloudflare тянет ответ по h2, а на пути
    # CF <-> MGTS-origin теряются мелкие управляющие пакеты (WINDOW_UPDATE) —
    # h2 flow control деадлочится после первого окна (~16-20 КБ), ответ
    # обрывается. HTTP/1.1 такого режима не имеет. Клиент <-> CF всё равно h2/h3.
    server {
        listen 443 ssl;
        server_name animemory.ru cdn.animemory.ru;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($from_cloudflare = 0) {
            return 403;
        }

        include /etc/nginx/locations.conf;
    }
}
