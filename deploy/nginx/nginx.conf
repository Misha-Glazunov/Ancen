worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2g; # совпадает с maxUploadBytes в cmd/server/main.go

    # Глобальный rate limit (ТЗ, раздел "Защита от атак"): приложение уже
    # лимитирует логин/регистрацию по логин+IP в коде, это — грубый защитный
    # слой перед ним на уровне прокси.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream app {
        server app:8080;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location ~ ^/(login|register|forgot-password) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Загрузка видео ждёт синхронного ffmpeg-транскодинга (adminUploadVideoHandler
        # в main.go) прежде чем ответить — дефолтный proxy_read_timeout (60s) обрывал
        # соединение на любом видео длиннее пары минут, браузер получал "ошибка
        # загрузки видео" при живом ffmpeg-процессе на сервере.
        location /api/admin/upload-video {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
