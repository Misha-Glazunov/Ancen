services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: ./deploy/mysql/.env
    volumes:
      - ${MYSQL_DATA_DIR:-./deploy/mysql/data}:/var/lib/mysql
      - ./deploy/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    env_file: ./deploy/minio/.env
    volumes:
      - ${MINIO_DATA_DIR:-./deploy/minio/data}:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ancen-app:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывают значения из .env — внутри compose-сети сервисы видны
      # по имени, а не по localhost/127.0.0.1, на которые обычно настроен .env
      # для локального `go run`.
      DB_HOST: mysql
      DB_PORT: "3306"
      MINIO_ENDPOINT: minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"

  # TURN/STUN-сервер для синхропросмотра (WebRTC). ВАЖНО: на домашнем ПК
  # входящие соединения извне блокирует провайдер (см. 22_Доступы_и_секреты
  # в Obsidian-заметках) — TURN-релей (порты ниже) недоступен друзьям вне
  # локальной сети/Tailscale, пока сайт не переедет на VPS или не появится
  # проброс портов. STUN-функция (3478) полезна уже сейчас — определяет
  # публичный адрес клиента для прямого P2P без релея.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # TURN_USER/TURN_PASSWORD — из корневого .env (как MYSQL_DATA_DIR выше),
    # не отдельный env_file: подстановка ${...} в command работает только
    # с переменными окружения хоста/корневого .env, не с env_file контейнера.
    # Без -n: entrypoint-скрипт образа прогоняет каждый аргумент через
    # `eval "echo $i"` — "-n" сам является флагом echo (подавляет перевод
    # строки), поэтому eval "echo -n" схлопывается в пустую строку и
    # turnserver получает пустой аргумент вместо "-n" ("Unknown argument: ").
    # Не критично: -n лишь запрещает читать turnserver.conf, которого и так
    # нет в контейнере.
    command:
      - --lt-cred-mech
      - --fingerprint
      - --realm=ancen.local
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  # ---------- Мониторинг инфраструктуры (Grafana/Prometheus) ----------
  # Не проксируется через nginx/домен намеренно — сайт и так недоступен
  # снаружи напрямую (провайдер блокирует входящие), доступ только по
  # Tailscale, поэтому порт 3000 открыт напрямую на хосте.

  # Метрики контейнеров (CPU/память/сеть на каждый сервис compose)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"

  # Метрики MySQL — креды берёт из корневого .env (те же DB_USER/DB_PASS,
  # что и app), не отдельный секрет.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${DB_USER}:${DB_PASS}@tcp(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9104"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # PROMETHEUS_DATA_DIR обязателен на проде вне build-директории раннера
      # (та стирается git clean перед каждым деплоем) — см. MYSQL_DATA_DIR выше.
      - ${PROMETHEUS_DATA_DIR:-./deploy/prometheus/data}:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - mysqld-exporter

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # GRAFANA_DATA_DIR — та же логика, что PROMETHEUS_DATA_DIR выше.
      - ${GRAFANA_DATA_DIR:-./deploy/grafana/data}:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
