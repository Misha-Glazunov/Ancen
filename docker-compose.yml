services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: ./deploy/mysql/.env
    volumes:
      - ${MYSQL_DATA_DIR:-./deploy/mysql/data}:/var/lib/mysql
      - ./deploy/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    env_file: ./deploy/minio/.env
    volumes:
      - ${MINIO_DATA_DIR:-./deploy/minio/data}:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ancen-app:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывают значения из .env — внутри compose-сети сервисы видны
      # по имени, а не по localhost/127.0.0.1, на которые обычно настроен .env
      # для локального `go run`.
      DB_HOST: mysql
      DB_PORT: "3306"
      MINIO_ENDPOINT: minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
