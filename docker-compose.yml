services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: ./deploy/mysql/.env
    volumes:
      - ${MYSQL_DATA_DIR:-./deploy/mysql/data}:/var/lib/mysql
      - ./deploy/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    env_file: ./deploy/minio/.env
    volumes:
      - ${MINIO_DATA_DIR:-./deploy/minio/data}:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ancen-app:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывают значения из .env — внутри compose-сети сервисы видны
      # по имени, а не по localhost/127.0.0.1, на которые обычно настроен .env
      # для локального `go run`.
      DB_HOST: mysql
      DB_PORT: "3306"
      MINIO_ENDPOINT: minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TURN/STUN-сервер для синхропросмотра (WebRTC). ВАЖНО: на домашнем ПК
  # входящие соединения извне блокирует провайдер (см. 22_Доступы_и_секреты
  # в Obsidian-заметках) — TURN-релей (порты ниже) недоступен друзьям вне
  # локальной сети/Tailscale, пока сайт не переедет на VPS или не появится
  # проброс портов. STUN-функция (3478) полезна уже сейчас — определяет
  # публичный адрес клиента для прямого P2P без релея.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # TURN_USER/TURN_PASSWORD — из корневого .env (как MYSQL_DATA_DIR выше),
    # не отдельный env_file: подстановка ${...} в command работает только
    # с переменными окружения хоста/корневого .env, не с env_file контейнера.
    # Без -n: entrypoint-скрипт образа прогоняет каждый аргумент через
    # `eval "echo $i"` — "-n" сам является флагом echo (подавляет перевод
    # строки), поэтому eval "echo -n" схлопывается в пустую строку и
    # turnserver получает пустой аргумент вместо "-n" ("Unknown argument: ").
    # Не критично: -n лишь запрещает читать turnserver.conf, которого и так
    # нет в контейнере.
    command:
      - --lt-cred-mech
      - --fingerprint
      - --realm=ancen.local
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Снаружи проброшен через роутер: внешний 8443 -> 443 (обход DPI
      # провайдера на 80/443). Origin для Cloudflare proxied.
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/locations.conf:/etc/nginx/locations.conf:ro
      # Cloudflare Origin Certificate (cert.pem + key.pem). На проде
      # NGINX_CERTS_DIR указывает на папку ВНЕ git-дерева
      # (C:/Users/mishg/ancen-certs) — приватный ключ не попадает в рабочую
      # копию репозитория. Локально fallback на самоподписанную заглушку.
      - ${NGINX_CERTS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - app

  # Публикует animemory.ru наружу без открытия портов (провайдер блокирует
  # входящие) — токен туннеля из серверного .env (не в git, как остальные
  # секреты), маршрутизация hostname -> nginx:80 настраивается в дашборде
  # Cloudflare (Zero Trust -> Networks -> Tunnels -> Public Hostname), не здесь.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2: QUIC (протокол по умолчанию, поверх UDP) циклически
    # рвался с "failed to accept QUIC stream: timeout: no recent network
    # activity" на этой сети — похоже на блокировку/деградацию UDP у
    # провайдера (тот же MGTS, что блокирует все входящие соединения).
    # HTTP/2 работает поверх обычного TCP, не подвержен этой проблеме.
    command: tunnel --no-autoupdate --protocol quic --edge-ip-version 4 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

  # ---------- Мониторинг инфраструктуры (Grafana/Prometheus) ----------
  # Не проксируется через nginx/домен намеренно — сайт и так недоступен
  # снаружи напрямую (провайдер блокирует входящие), доступ только по
  # Tailscale, поэтому порт 3000 открыт напрямую на хосте.

  # Метрики контейнеров (CPU/память/сеть на каждый сервис compose).
  # ВАЖНО: Docker Desktop (Windows/WSL2) использует containerd-снапшоттер,
  # из-за которого штатная докер-интеграция cadvisor не может сопоставить
  # контейнеры ("failed to identify the read-write layer ID" — legacy
  # overlay2-graphdriver путей просто нет). Обход — говорить с containerd
  # напрямую (-containerd), проверено вживую 2026-08-20. НЕ монтируем
  # /var/run целиком (там лежит docker.sock) — если cadvisor видит и
  # docker.sock, и containerd.sock, оба фактори регистрируются и порядок
  # между ними произвольный (рандомизация Go при старте), из-за чего
  # docker-фактори иногда "побеждает" за контейнер и падает с той же
  # ошибкой. Без docker.sock регистрация docker-фактори гарантированно
  # проваливается, остаётся только containerd — детерминированно.
  # Метки контейнеров при этом приходят как "image", не "name" (id — хеш).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    command:
      - -docker_only=true
      - -containerd=/run/containerd/containerd.sock
      - -containerd-namespace=moby
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    expose:
      - "8080"

  # Метрики MySQL — креды берёт из корневого .env (те же DB_USER/DB_PASS,
  # что и app), не отдельный секрет.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${DB_USER}:${DB_PASS}@tcp(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9104"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # PROMETHEUS_DATA_DIR обязателен на проде вне build-директории раннера
      # (та стирается git clean перед каждым деплоем) — см. MYSQL_DATA_DIR выше.
      - ${PROMETHEUS_DATA_DIR:-./deploy/prometheus/data}:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - mysqld-exporter

  grafana:
    # 13.x (не 11.2.0) — нужны extra headers/custom payload в webhook-контакте
    # (новое в 12.0/12.1), без них не завести алерты в MAX (см. rules.yml).
    # Собственный образ поверх grafana/grafana:13.1.4 — добавляет корневой
    # сертификат Минцифры (deploy/grafana/ca-certs/), без которого webhook
    # в MAX API падает с "x509: certificate signed by unknown authority"
    # (MAX использует российский национальный УЦ, его нет в базовом образе).
    image: ancen-grafana:13.1.4-max-ca
    build: ./deploy/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # GRAFANA_DATA_DIR — та же логика, что PROMETHEUS_DATA_DIR выше.
      - ${GRAFANA_DATA_DIR:-./deploy/grafana/data}:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
