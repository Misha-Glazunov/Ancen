<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Anime.Title}} — Ancen</title>
</head>
<body>
    <nav>
        <a href="/">Главная</a>
        <form method="GET" action="/search" style="display: inline-block;">
            <input type="text" name="q" placeholder="Поиск...">
            <button type="submit">🔍</button>
        </form>
        <a href="/profile">Профиль</a>
        <a href="/logout">Выход</a>
    </nav>
    <hr>
    <h1>{{.Anime.Title}}</h1>
    <img src="{{.Anime.Poster}}" width="200">
    <p>{{.Anime.Description}}</p>
    <p><strong>Жанры:</strong> {{.Anime.Genres}}</p>
    <h3>Эпизоды</h3>
    <ul>
        {{range .Episodes}}
        <li>
            <a href="/watch?episode={{.ID}}">Серия {{.Num}}: {{.Title}}</a>
        </li>
        {{end}}
    </ul>

    {{template "footer" .}}
</body>
</html>
