<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — AniMemory</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Manrope:wght@400;500;600&family=MuseoModerno:wght@400;700;800&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
        }
        body {
            font-family: 'Jost', sans-serif;
            background: #000 url('/static/img/login/background_image_blure_v3.png') no-repeat top center;
            background-size: cover;
            color: #fff;
            position: relative;
        }
        .page-fullscreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 140px;
            flex-wrap: wrap;
            gap: 16px;
            position: relative;
            z-index: 1;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo-img { width: 244px; height: 57px; flex-shrink: 0; object-fit: contain; }
        .button-login-registry {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: absolute;
            width: 155px;
            height: 34px;
            right: 140px;
            top: 29px;
            background: rgba(0, 0, 0, 0.01);
            backdrop-filter: blur(20px);
            border-radius: 10px;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .button-login-registry::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            padding: 1px;
            background: linear-gradient(135deg, #5E0135, #331C76);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .button-login-registry:hover { background: rgb(255, 255, 255); color: #000; }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            bottom: 30px;
            padding: 40px 140px;
            position: relative;
            z-index: 1;
        }
        .page-title {
            font-size: 36px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 40px;
        }

        /* ===== FORM ===== */
        .form {
            display: flex;
            flex-direction: column;
            width: 350px;
            gap: 20px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-field input {
            width: 100%;
            height: 40px;
            border: none;
            border-bottom: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-family: 'Jost', sans-serif;
            font-size: 18px;
            outline: none;
            padding: 0 4px;
            transition: border-color 0.2s;
        }
        .form-field input:focus { border-bottom-color: #d82d7e; }
        .form-field input::placeholder { color: rgba(255,255,255,0.3); }

        .button-form {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #000;
            font-family: 'Jost', sans-serif;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .button-form:hover { background: #e0e0e0; }
        .button-form:active { transform: scale(0.98); }

        /* ===== ALERT ===== */
        .alert {
            width: 350px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }
        .alert-error { background: rgba(255,80,80,0.15); border: 1px solid #ff5050; color: #ff5050; }
        .alert-success { background: rgba(80,255,80,0.15); border: 1px solid #50ff50; color: #50ff50; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header { padding: 16px 20px; }
            .button-login-registry { width: 140px; font-size: 14px; }
            .page-title { font-size: 28px; }
            .form { width: 100%; max-width: 350px; }
            .main { padding: 40px 20px; }
        }
        @media (max-width: 400px) {
            .header-logo-img { width: 180px; height: auto; }
            .button-login-registry { position: static; width: 100%; margin-top: 12px; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="page-fullscreen">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="/" class="header-logo">
                <img src="/static/img/header/logo_header.png" alt="AniMemory" class="header-logo-img">
            </a>
            <a href="/login" class="button-login-registry">Вход \ Регистрация</a>
        </header>

        <!-- ===== MAIN ===== -->
        <main class="main">
            <h1 class="page-title">Смена пароля</h1>

            {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
            {{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}

            <form class="form" method="POST" action="/new-password">
                <input type="hidden" name="token" value="{{.Token}}">

                <div class="form-field">
                    <input type="password" id="password" name="password" placeholder="Новый пароль" required>
                </div>

                <div class="form-field">
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="Повторите новый пароль" required>
                </div>

                <button type="submit" class="button-form">Сменить пароль</button>
            </form>
        </main>
    </div>

    {{template "footer" .}}

</body>
</html>
