{{define "footer"}}
<footer class="site-footer">
    <div class="footer-container">
        <!-- Левая часть: логотип + копирайт + политика -->
        <div class="footer-left">
            <div class="footer-logo">
                <img src="/static/img/footer/logo_footer.png" alt="AniMemory">
            </div>
            <div class="footer-copy-row">
                <span class="footer-copy">© 2026 AniMemory</span>
                <a href="/privacy-policy" class="policy-button">Политика конфиденциальности</a>
            </div>
        </div>

        <!-- Колонки -->
        <div class="footer-columns">
            <!-- Колонка "Аниме" -->
            <div class="footer-col">
                <h4>Аниме</h4>
                <div class="underline"></div>
                <ul>
                    <li class="popular">Популярные</li>
                    <li class="new">Новинки</li>
                    <li class="favorites">Избранное</li>
                </ul>
            </div>

            <!-- Колонка "Меню" -->
            <div class="footer-col">
                <h4>Меню</h4>
                <div class="underline"></div>
                <ul>
                    <li class="home">На главную</li>
                    <li class="profile">Личный кабинет</li>
                    <li class="auth">Вход/Регистрация</li>
                </ul>
            </div>

            <!-- Колонка "Наши контакты" -->
            <div class="footer-col">
                <h4>Наши контакты</h4>
                <div class="underline"></div>
                <div class="contacts-email">mishgun.gl@gmail.com</div>
                <div class="contacts-icons">
                    <!-- Telegram -->
                    <img src="/static/img/footer/telegram.png" alt="Telegram" class="icon-telegram">
                    <!-- Instagram -->
                    <img src="/static/img/footer/instagram.png" alt="Instagram" class="icon-instagram">
                    <!-- Gmail -->
                    <img src="/static/img/footer/gmail.png" alt="Gmail" class="icon-gmail">
                </div>
            </div>
        </div>
    </div>
</footer>

<style>
/* ===== FOOTER STYLES (из Figma) ===== */
.site-footer {
    background: #ffffff;
    color: #000000;
    font-family: 'Jost', sans-serif;
    width: 100%;
    /* 1440×220 из Figma */
}

.footer-container {
    max-width: 100%;
    margin: 0 auto;
    padding: 40px 140px 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 40px;
    box-sizing: border-box;
}

/* Левая часть */
.footer-left {
    display: flex;
    flex-direction: column;
    gap: 16px;
    left: 140px;
}

.footer-logo img {
    width: 357px;
    height: 80px;
    display: block;
    object-fit: contain;
}

.footer-copy-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.footer-copy {
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
}

.policy-button {
    font-size: 16px;
    font-weight: 500;
    text-decoration: underline;
    color: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
}
.policy-button:hover { opacity: 0.7; }

/* Колонки */
.footer-columns {
    display: flex;
    gap: 120px;
    flex-wrap: wrap;
    right: 140px;
}

.footer-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.footer-col h4 {
    font-family: 'Jost', sans-serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1;
    margin: 0;
    color: #000;
}

.footer-col .underline {
    width: 100%;
    height: 1px;
    background: #000;
    margin: 2px 0 4px;
}

.footer-col ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.footer-col ul li {
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    line-height: 1;
}
.footer-col ul li:hover { opacity: 0.6; }

/* Контакты */
.contacts-email {
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
}

.contacts-icons {
    display: flex;
    gap: 42px;
    align-items: center;
}

.contacts-icons img {
    width: 30px;
    height: 30px;
    cursor: pointer;
    transition: opacity 0.2s;
    object-fit: contain;
}
.contacts-icons img:hover { opacity: 0.7; }

/* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
    .footer-container {
        padding: 30px 20px;
        flex-direction: column;
    }
    .footer-columns {
        gap: 40px;
    }
    .footer-logo img {
        width: 180px;
        height: 40px;
    }
}
</style>
</footer>
{{end}}
