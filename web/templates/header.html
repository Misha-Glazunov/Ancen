{{define "header"}}
{{if .Username}}
<!-- Header (Figma, "AniMemory залогиненый"): для авторизованных пользователей на всех страницах -->
<header class="site-header site-header-user">
    <a href="/" class="header-logo">
        <img src="/static/img/header/logo_header.png" alt="AniMemory" class="header-logo-img">
    </a>
    <div class="header-search-wrap">
        <form method="GET" action="/search" class="header-search-form">
            <span class="header-search-glass">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input type="text" name="q" placeholder="Поиск аниме" autocomplete="off">
            </span>
            <button type="submit" class="header-search-submit">Искать</button>
        </form>
        <div class="header-search-results">
            <div class="header-search-tabs">
                <button type="button" class="active" data-tab="anime">Аниме</button>
                <button type="button" data-tab="friends">Друзья</button>
            </div>
            <div class="header-search-list" data-list="anime"></div>
            <div class="header-search-list" data-list="friends" hidden></div>
        </div>
    </div>
    <nav class="header-nav">
        <a href="/#new-anime" data-swap-word>Новое</a>
        <a href="/#popular-anime" data-swap-word>Популярное</a>
        <a href="/profile" data-swap-word>Избранное</a>
        <a href="/messages" data-swap-word>Сообщения</a>
        <a href="/premium" data-swap-word>Premium</a>
    </nav>
    <div class="header-account">
        <a href="/profile" class="header-avatar" id="header-avatar" title="{{.Username}}"><span id="header-avatar-initial">{{initial .Username}}</span><span class="header-friend-badge" id="header-friend-badge" hidden>0</span></a>
        <a href="/logout" class="header-logout" title="Выйти" data-swap-word>Выход</a>
    </div>
</header>
<div id="party-invite-banner" hidden>
    <span id="party-invite-text"></span>
    <div class="party-invite-actions">
        <button type="button" id="party-invite-accept" class="btn btn-sm">Принять</button>
        <button type="button" id="party-invite-decline" class="btn btn-sm">Отклонить</button>
    </div>
</div>
{{else}}
<!-- Header_Unlogin (Figma): для неавторизованных пользователей на всех публичных страницах -->
<header class="site-header site-header-guest">
    <a href="/" class="header-logo">
        <img src="/static/img/header/logo_header.png" alt="AniMemory" class="header-logo-img">
    </a>
    <div class="header-search-wrap">
        <form method="GET" action="/search" class="header-search-form">
            <span class="header-search-glass">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input type="text" name="q" placeholder="Поиск аниме и друзей" autocomplete="off">
            </span>
            <button type="submit" class="header-search-submit">Искать</button>
        </form>
        <div class="header-search-results">
            <div class="header-search-tabs">
                <button type="button" class="active" data-tab="anime">Аниме</button>
                <button type="button" data-tab="friends">Друзья</button>
            </div>
            <div class="header-search-list" data-list="anime"></div>
            <div class="header-search-list" data-list="friends" hidden></div>
        </div>
    </div>
    <nav class="header-nav">
        <a href="/#new-anime" data-swap-word>Новое</a>
        <a href="/#popular-anime" data-swap-word>Популярное</a>
        <a href="/login" data-swap-word>Избранное</a>
    </nav>
    <a href="/login" class="btn button-login-registry">Вход \ Регистрация</a>
</header>
{{end}}

<style>
/* Неисчезающий баннер приглашения на синхропросмотр — виден на любой
   странице сайта (в отличие от toast.js, который сам прячется через 5с и
   не годится для действия, требующего решения пользователя).
   position:fixed (не sticky) — баннер должен быть виден независимо от того,
   где по странице проскроллен пользователь, а не только когда верх страницы
   виден в вьюпорте. Выше z-index шапки (которая тоже sticky/top:0), чтобы
   лежать поверх неё, а не прятаться под ней при одинаковом top:0. */
#party-invite-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 140px;
    background: var(--color-gray-950);
    border-bottom: 1px solid var(--color-accent);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1001;
}
.party-invite-actions { display: flex; gap: 8px; flex-shrink: 0; }
@media (max-width: 768px) {
    #party-invite-banner { padding: 12px 16px; flex-wrap: wrap; }
}

.site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 20px 140px;
    background: var(--color-bg);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.header-logo-img { width: 160px; height: auto; display: block; object-fit: contain; }
.header-nav { display: flex; align-items: center; gap: 28px; max-width: 500px; white-space: nowrap; }
.header-nav a {
    font-family: var(--font-base);
    font-size: var(--fs-body);
    /* line-height:1, как у .footer-col ul li — иначе letter-swap.js клипует
       буквы по завышенной строке (наследуемый line-height шапки выше) и
       старая буква остаётся видна под новой при анимации hover. */
    line-height: 1;
    color: var(--color-text);
    text-decoration: none;
}

/* ===== Header (авторизованный пользователь), из Figma ===== */
.header-account { display: flex; align-items: center; gap: 14px; flex-shrink: 0; max-width: 200px; white-space: nowrap; }
.header-avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-lg);
    background: var(--color-accent-gradient);
    color: var(--color-text);
    font-family: var(--font-display);
    font-size: 18px;
    text-decoration: none;
    transition: opacity 0.2s;
    position: relative;
    overflow: hidden;
}
.header-avatar:hover { opacity: 0.85; }
.header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.header-friend-badge {
    /* .header-account (родитель) держит overflow:hidden для анимации
       сворачивания при поиске — бейдж не может вылезать за край аватарки,
       иначе обрезается, поэтому сидит внутри квадрата, а не поверх угла. */
    position: absolute;
    top: 2px;
    right: 2px;
    min-width: 16px;
    height: 16px;
    padding: 0 3px;
    border-radius: 8px;
    background: var(--color-accent);
    color: #fff;
    font-family: var(--font-base);
    font-size: 10px;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 2px var(--color-bg);
}
/* display:flex безусловно на .header-friend-badge перебивал бы атрибут
   hidden (author-стиль побеждает UA [hidden]{display:none} независимо от
   specificity) — бейдж навсегда оставался бы видимым с "0" внутри.
   :not([hidden]) возвращает элементу нормальное поведение hidden. */
.header-friend-badge:not([hidden]) { display: flex; }
.header-logout {
    font-family: var(--font-base);
    font-size: var(--fs-small);
    color: var(--color-gray-300);
    text-decoration: none;
}

/* ===== Header_Unlogin (гость), 1:1 из Figma ===== */

.header-search-wrap {
    position: relative;
    flex: 0 0 270px;
    width: 270px;
    transition: flex-grow 0.4s ease, flex-basis 0.4s ease;
    z-index: 1001;
}
.header-search-wrap.active {
    flex: 1 1 auto;
}
.header-nav,
.header-account {
    overflow: hidden;
    transition: opacity 0.35s ease, max-width 0.4s ease, margin 0.4s ease, padding 0.4s ease;
}
.button-login-registry { overflow: hidden; }
.site-header.search-active .header-nav,
.site-header.search-active .header-account,
.site-header.search-active .button-login-registry {
    opacity: 0;
    max-width: 0;
    padding-left: 0 !important;
    padding-right: 0 !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    pointer-events: none;
}
.header-search-form { display: flex; align-items: center; gap: 10px; width: 100%; }
.header-search-glass {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    height: 40px;
    padding: 0 16px;
    box-sizing: border-box;
    position: relative;
    background: rgba(0, 0, 0, 0.01);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    border: 1px solid transparent;
    background-clip: padding-box;
}
.header-search-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: var(--color-accent-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
.header-search-glass .search-icon { font-size: 14px; flex-shrink: 0; }
.header-search-glass input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: var(--fs-small);
    min-width: 0;
}
.header-search-glass input::placeholder { color: rgba(255,255,255,0.5); }
.header-search-submit {
    flex-shrink: 0;
    height: 40px;
    padding: 0 20px;
    box-sizing: border-box;
    background-color: rgba(0, 0, 0, 0.01);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    font-family: var(--font-base);
    font-size: var(--fs-small);
    color: var(--color-text);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid transparent;
    background-clip: padding-box;
    display: none;
    transition: color 0.3s ease 0.05s, transform 0.2s ease, box-shadow 0.3s ease;
}
.header-search-wrap.active .header-search-submit { display: block; }
.header-search-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: var(--color-accent-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
.header-search-submit::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: #fff;
    clip-path: ellipse(80% 50% at 50% 152%);
    transition: clip-path 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    pointer-events: none;
}
.header-search-submit:hover::after {
    clip-path: ellipse(100% 70% at 50% 50%);
    transition: clip-path 0.8s cubic-bezier(0.86, 0, 0.07, 1);
}
.header-search-submit:hover {
    color: #000;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(216, 45, 126, 0.35);
}

.header-search-results {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    background: #000;
    border-radius: var(--radius-lg);
    padding: 20px;
    max-height: 60vh;
    overflow-y: auto;
    box-sizing: border-box;
    text-align: left;
    scrollbar-width: thin;
    scrollbar-color: #d82d7e transparent;
}
.header-search-results::-webkit-scrollbar { width: 10px; }
.header-search-results::-webkit-scrollbar-track { background: transparent; }
.header-search-results::-webkit-scrollbar-thumb { background: #d82d7e; border-radius: 10px; }
.header-search-wrap.active .header-search-results { display: block; }
.header-search-tabs { display: flex; gap: 12px; margin-bottom: 16px; }
.header-search-tabs button {
    padding: 8px 20px;
    border-radius: var(--radius-lg);
    border: 2px solid var(--color-purple);
    background: transparent;
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: var(--fs-body);
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s;
}
.header-search-tabs button.active {
    border-color: var(--color-accent);
    box-shadow: 0 0 14px rgba(216, 45, 126, 0.6);
}
.header-search-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    text-decoration: none;
    color: var(--color-text);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.header-search-item:last-child { border-bottom: none; }
.header-search-item img { width: 56px; height: 78px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; }
.header-search-item.friend img { height: 56px; border-radius: var(--radius-lg); }
.header-search-item.friend .avatar-fallback {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: var(--radius-lg);
    background: var(--color-accent-gradient); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 18px;
}
.header-search-item .info { flex: 1; min-width: 0; }
.header-search-item .info .title { font-size: var(--fs-body); margin-bottom: 6px; }
.header-search-item .info .genre-tag { margin-bottom: 6px; }
.header-search-item .info .year { font-size: var(--fs-small); color: var(--color-gray-500); display: block; }
.header-search-item .level {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-small);
    color: var(--color-warm-red);
}
.header-search-item .level b {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-weight: 400;
}
.header-search-empty { color: var(--color-gray-500); padding: 12px 0; }

.button-login-registry {
    width: 160px;
    max-width: 160px;
    height: 32px;
    padding: 4px 16px;
    transition: color 0.3s ease 0.05s, transform 0.2s ease, box-shadow 0.3s ease,
        opacity 0.35s ease, max-width 0.4s ease, margin 0.4s ease, padding 0.4s ease;
    flex-shrink: 0;
}

@media (max-width: 768px) {
    .site-header { padding: 16px 20px; justify-content: center; text-align: center; }
    .header-logo-img { width: 130px; }
    .header-nav { gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; order: 3; }
    .header-search-wrap { order: 2; width: 100%; flex-basis: 100%; }
    .button-login-registry { order: 1; }
    .header-account { order: 1; }
}

@media (max-width: 420px) {
    .header-nav { gap: 10px; font-size: var(--fs-small); }
    .header-nav a { font-size: var(--fs-small); }
}
</style>
<script src="/static/js/toast.js?v=2"></script>
<script>
(function () {
    function levelColor(l) { return l >= 8 ? 'var(--color-warm-red)' : l >= 4 ? 'var(--color-warm-orange)' : '#fff'; }
    function escapeHtml(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var animeSearchAbort = null;
    function renderAnime(list, query) {
        if (!query) { list.innerHTML = '<div class="header-search-empty">Начните вводить название</div>'; return; }
        if (animeSearchAbort) animeSearchAbort.abort();
        animeSearchAbort = new AbortController();
        fetch('/api/anime/search?q=' + encodeURIComponent(query), { signal: animeSearchAbort.signal })
            .then(function (r) { return r.json(); })
            .then(function (items) {
                if (!items || !items.length) { list.innerHTML = '<div class="header-search-empty">Ничего не найдено</div>'; return; }
                list.innerHTML = items.map(function (a) {
                    return '<a class="header-search-item" href="/anime/' + a.id + '">' +
                        '<img src="' + a.poster + '" alt="">' +
                        '<div class="info"><div class="title">' + escapeHtml(a.title) + '</div>' +
                        '<span class="genre-tag">' + escapeHtml(a.genres) + '</span>' +
                        '<span class="year">' + escapeHtml(a.year) + '</span></div></a>';
                }).join('');
            })
            .catch(function (e) { if (e.name !== 'AbortError') list.innerHTML = '<div class="header-search-empty">Ошибка поиска</div>'; });
    }

    var friendsSearchAbort = null;
    function renderFriends(list, query) {
        if (!query) { list.innerHTML = '<div class="header-search-empty">Начните вводить имя пользователя</div>'; return; }
        if (friendsSearchAbort) friendsSearchAbort.abort();
        friendsSearchAbort = new AbortController();
        fetch('/api/users/search?q=' + encodeURIComponent(query), { signal: friendsSearchAbort.signal })
            .then(function (r) { return r.json(); })
            .then(function (items) {
                if (!items || !items.length) { list.innerHTML = '<div class="header-search-empty">Ничего не найдено</div>'; return; }
                list.innerHTML = items.map(function (f) {
                    var avatar = f.AvatarURL ? '<img src="' + f.AvatarURL + '" alt="">' : '<span class="avatar-fallback">' + escapeHtml(f.Username.charAt(0).toUpperCase()) + '</span>';
                    return '<a class="header-search-item friend" href="/profile/' + encodeURIComponent(f.Username) + '">' +
                        avatar +
                        '<div class="info"><div class="title">' + escapeHtml(f.Username) + '</div>' +
                        '<span class="level">Уровень <b style="color:' + levelColor(f.Level) + '">' + f.Level + '</b></span></div>' +
                        '</a>';
                }).join('');
            })
            .catch(function (e) { if (e.name !== 'AbortError') list.innerHTML = '<div class="header-search-empty">Ошибка поиска</div>'; });
    }

    document.querySelectorAll('.header-search-wrap').forEach(function (wrap) {
        var input = wrap.querySelector('.header-search-glass input');
        var animeList = wrap.querySelector('[data-list="anime"]');
        var friendsList = wrap.querySelector('[data-list="friends"]');
        var tabs = wrap.querySelectorAll('.header-search-tabs button');

        function activeTab() {
            var btn = wrap.querySelector('.header-search-tabs button.active');
            return btn ? btn.dataset.tab : 'anime';
        }

        var updateTimer = null;
        function update() {
            var query = input.value.trim().toLowerCase();
            clearTimeout(updateTimer);
            updateTimer = setTimeout(function () {
                renderAnime(animeList, query);
                renderFriends(friendsList, query);
            }, 250);
        }

        tabs.forEach(function (btn) {
            btn.addEventListener('click', function () {
                tabs.forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                animeList.hidden = btn.dataset.tab !== 'anime';
                friendsList.hidden = btn.dataset.tab !== 'friends';
            });
        });

        var header = wrap.closest('.site-header');

        input.addEventListener('focus', function () {
            wrap.classList.add('active');
            if (header) header.classList.add('search-active');
            update();
        });
        input.addEventListener('input', update);
        document.addEventListener('click', function (e) {
            if (!wrap.contains(e.target)) {
                wrap.classList.remove('active');
                if (header) header.classList.remove('search-active');
            }
        });
        wrap.querySelector('form').addEventListener('submit', function (e) {
            if (activeTab() === 'friends') e.preventDefault();
        });
    });

    // Бейдж на аватарке — сумма непрочитанных сообщений и заявок в друзья,
    // одним числом (решено 2026-08-14), а не раздельными индикаторами.
    // Вынесено в функцию, чтобы дёргать не только при загрузке страницы, но и
    // сразу по приходу нового сообщения через /ws/dm — иначе счётчик отставал
    // до следующей перезагрузки страницы.
    var badge = document.getElementById('header-friend-badge');
    function refreshFriendBadge() {
        if (!badge) return;
        Promise.all([
            fetch('/api/friends/requests').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
            fetch('/api/messages/unread-count').then(function (r) { return r.ok ? r.json() : { count: 0 }; }).catch(function () { return { count: 0 }; })
        ]).then(function (results) {
            var friendRequests = (results[0] || []).length;
            var unreadMessages = (results[1] || {}).count || 0;
            var total = friendRequests + unreadMessages;
            badge.hidden = total === 0;
            if (total > 0) badge.textContent = total > 9 ? '9+' : String(total);
        });
    }
    refreshFriendBadge();

    // Приглашение на синхропросмотр — глобально, видно на любой странице сайта
    // (не только на watch.html конкретной серии). Использует /ws/dm — тот же
    // push-канал по user_id, что и личные сообщения (messages.html открывает
    // его отдельно для своих целей, это независимое второе соединение).
    // Этот же сокет теперь несёт и push обычных личных сообщений (type: 'dm') —
    // тост + живое обновление бейджа, чтобы не пропустить сообщение, если
    // получатель не находится прямо в этом диалоге на /messages.
    var partyBanner = document.getElementById('party-invite-banner');
    if (partyBanner) {
        var pendingParty = null; // { partyId, episodeId, hostUserId }

        function acceptParty() {
            if (!pendingParty) return;
            var p = pendingParty;
            window.location.href = '/watch?episode=' + p.episodeId + '&party=' + encodeURIComponent(p.partyId) + '&host=' + p.hostUserId;
        }
        function declineParty() {
            if (!pendingParty) return;
            fetch('/api/party/decline', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ party_id: pendingParty.partyId })
            }).catch(function () {});
            pendingParty = null;
            partyBanner.style.display = 'none';
        }

        function connectPartyDM() {
            var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var ws = new WebSocket(proto + '//' + window.location.host + '/ws/dm');
            ws.onmessage = function (event) {
                var data;
                try { data = JSON.parse(event.data); } catch (e) { return; }
                if (data.type === 'party_invite') {
                    // Уже ждём ответа на другое приглашение — новое просто игнорируем
                    // (MVP на двоих без очереди, как и раньше на watch.html).
                    if (pendingParty) return;
                    pendingParty = { partyId: data.party_id, episodeId: data.episode_id, hostUserId: data.user_id };
                    document.getElementById('party-invite-text').textContent = data.username + ' зовёт смотреть аниме вместе';
                    partyBanner.style.display = 'flex';
                    if (typeof window.showToast === 'function') {
                        window.showToast({
                            icon: '🎬', title: 'Приглашение на синхропросмотр',
                            body: data.username + ' зовёт смотреть аниме вместе',
                            actions: [
                                { label: 'Принять', onClick: acceptParty },
                                { label: 'Отклонить', onClick: declineParty }
                            ]
                        });
                    }
                } else if (data.type === 'dm') {
                    var m = data.message;
                    // Если получатель прямо сейчас смотрит именно этот диалог на
                    // /messages — там сообщение и так появится живьём (свой сокет
                    // messages.html), тост здесь будет только шумом.
                    if (window.__ancenActiveWithID !== m.sender_id && typeof window.showToast === 'function') {
                        window.showToast({
                            icon: '💬', title: m.sender_username + ' написал(а) вам', body: m.text,
                            onClick: function () { window.location.href = '/messages?with=' + m.sender_id; }
                        });
                    }
                    refreshFriendBadge();
                }
            };
            ws.onclose = function () { setTimeout(connectPartyDM, 3000); };
        }
        connectPartyDM();

        document.getElementById('party-invite-accept').addEventListener('click', acceptParty);
        document.getElementById('party-invite-decline').addEventListener('click', declineParty);
    }

    var avatarInitial = document.getElementById('header-avatar-initial');
    if (avatarInitial) {
        fetch('/api/user/avatar').then(function (r) { return r.ok ? r.json() : {}; }).then(function (res) {
            if (res.avatar_url) {
                var img = document.createElement('img');
                img.src = res.avatar_url;
                img.alt = '';
                avatarInitial.replaceWith(img);
            }
        }).catch(function () {});
    }
})();
</script>
{{end}}
