<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Manrope:wght@400;500;600&family=MuseoModerno:wght@400;700;800&family=Nothing+You+Could+Do&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=2">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }
        a { color: #ffaa44; text-decoration: none; }
        .container { max-width: 1000px; margin: 0 auto; }
        nav { margin-bottom: 20px; }
        button, input { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Главная</a>
            <form method="GET" action="/search" style="display: inline-block; margin: 0 10px;">
                <input type="text" name="q" placeholder="Поиск аниме..." value="{{.Query}}" style="padding: 5px;">
                <button type="submit" style="padding: 5px 10px;">🔍</button>
            </form>
            <a href="/profile">Профиль</a>
            <a href="/logout">Выход</a>
        </nav>
        <hr>
        {{.Content}}
    </div>
</body>
</html>
