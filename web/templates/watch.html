<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — смотреть с реакциями и комментариями | AniMemory</title>
    <meta name="description" content="Смотри «{{.Title}}» на AniMemory — ставь реакции на любом таймкоде и читай комментарии других зрителей в реальном времени.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Manrope:wght@400;500;600&family=MuseoModerno:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-base); }
        .container { max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; }

        h2.episode-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: var(--fs-display-md);
            margin: 20px 0;
        }
        h3 {
            font-family: var(--font-base);
            font-weight: 700;
            font-size: var(--fs-heading);
            border-bottom: 1px solid var(--color-gray-700);
            padding-bottom: 10px;
            margin-top: 40px;
        }

        #resumeDialog {
            display: none;
            background: var(--color-gray-950);
            border: 1px solid var(--color-accent);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }
        #resumeDialog button {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-base);
            cursor: pointer;
            margin: 8px 6px 0;
        }
        #resumeBtn { background: var(--color-accent-gradient); color: #fff; }
        #restartBtn { background: var(--color-gray-700); color: #fff; }

        /* ===== Видеоплеер: адаптивная обёртка 16:9 ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .video-wrapper .video-js {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            inset: 0;
        }

        /* ===== Кнопки эмоций ===== */
        .emotion-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        .emotion-buttons button {
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            background: var(--color-gray-950);
            border: none;
            border-radius: var(--radius-lg);
            padding: 10px 16px;
            transition: transform 0.1s, background 0.2s;
        }
        .emotion-buttons button:hover { transform: scale(1.1); background: var(--color-gray-900); }

        /* ===== График эмоций ===== */
        .chart-wrapper {
            width: 100%;
            margin: 10px 0;
        }
        #emotionChart {
            width: 100%;
            height: 150px;
            background: var(--color-gray-950);
            border-radius: var(--radius-lg);
            display: block;
        }

        #emotion-list, #comments-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #emotion-list li, #comments-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--color-gray-900);
            font-size: var(--fs-small);
            word-break: break-word;
        }

        .comment-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 16px 0;
        }
        .comment-form input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-gray-700);
            background: var(--color-gray-950);
            color: var(--color-text);
            font-family: var(--font-base);
        }
        .comment-form button {
            padding: 10px 22px;
            border-radius: var(--radius-lg);
            border: none;
            background: var(--color-accent-gradient);
            color: #fff;
            font-family: var(--font-base);
            cursor: pointer;
            white-space: nowrap;
        }
        .comment-form .timecode {
            font-size: var(--fs-small);
            color: var(--color-gray-500);
        }

        #pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
        }
        #pagination button {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-gray-700);
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
        }
        #pagination button:hover { border-color: var(--color-accent); color: var(--color-accent); }

        @media (max-width: 768px) {
            .container { padding: 16px 16px 40px; }
            h2.episode-title { font-size: 24px; }
            .emotion-buttons button { font-size: 1.5rem; padding: 8px 12px; }
            .comment-form { flex-direction: column; align-items: stretch; }
            .comment-form .timecode { text-align: center; }
        }

        @media (max-width: 480px) {
            #emotionChart { height: 110px; }
        }
    </style>
</head>
<body>
{{template "header" .}}
<div class="container">
    <h2 class="episode-title">Эпизод {{.EpisodeNum}}: {{.Title}}</h2>

    <div id="resumeDialog">
        <p>У вас есть сохранённый прогресс: <span id="resumeTime">0:00</span></p>
        <button id="resumeBtn">Продолжить</button>
        <button id="restartBtn">Начать сначала</button>
    </div>

    <!-- Видеоплеер -->
    <div class="video-wrapper">
        <video
            id="my-video"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls
            preload="auto"
            data-setup='{"fluid": true, "responsive": true}'>
            <source src="{{.VideoURL}}" type="{{videoMimeType .VideoURL}}">
            <p class="vjs-no-js">Для просмотра видео включите JavaScript</p>
        </video>
    </div>

    <!-- Кнопки эмоций -->
    <div class="emotion-buttons">
        <button class="emotion-btn" data-emotion="😭">😭</button>
        <button class="emotion-btn" data-emotion="🔥">🔥</button>
        <button class="emotion-btn" data-emotion="🤯">🤯</button>
        <button class="emotion-btn" data-emotion="🥰">🥰</button>
        <button class="emotion-btn" data-emotion="💢">💢</button>
    </div>

    <div class="chart-wrapper">
        <canvas id="emotionChart"></canvas>
    </div>

    <h3>Эмоции зрителей</h3>
    <ul id="emotion-list">
        <li>Загрузка...</li>
    </ul>

    <h3>Комментарии к таймкоду</h3>
    <div class="comment-form">
        <input type="text" id="commentText" placeholder="Ваш комментарий">
        <button id="sendCommentBtn">Отправить</button>
        <span class="timecode">Таймкод: <span id="currentTimeDisplay">0:00</span></span>
    </div>
    <ul id="comments-list">
        <li>Загрузка...</li>
    </ul>
    <div id="pagination">
        <button id="prevPageBtn">Предыдущая</button>
        <span id="currentPage">1</span>
        <button id="nextPageBtn">Следующая</button>
    </div>
</div>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    var player = videojs('my-video', { fluid: true, responsive: true });

    // Получаем ID эпизода из URL
    const urlParams = new URLSearchParams(window.location.search);
    let episodeId = parseInt(urlParams.get('episode'));
    if (isNaN(episodeId)) episodeId = 1;

    let ws;

    // --- WebSocket ---
    function connectWebSocket() {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${window.location.host}/ws?episode_id=${episodeId}`);
        ws.onopen = function() {
            console.log("✅ WebSocket connected for episode", episodeId);
        };
        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'emotion') {
                addEmotionToList(msg.username, msg.emotion_type, msg.timestamp_sec);
                loadStats();   // обновить график
            }
        };
        ws.onclose = function() {
            console.log("🔌 WebSocket closed, reconnecting in 3s...");
            setTimeout(connectWebSocket, 3000);
        };
        ws.onerror = function(err) {
            console.error("❌ WebSocket error", err);
        };
    }

    // --- Лента эмоций ---
    function addEmotionToList(username, emotionType, timestampSec) {
        const list = document.getElementById('emotion-list');
        // Убираем заглушку "Пока нет эмоций", если она есть
        if (list.children.length === 1 && list.children[0].innerText.includes('Пока нет эмоций')) {
            list.innerHTML = '';
        }
        const minutes = Math.floor(timestampSec / 60);
        const seconds = timestampSec % 60;
        const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
        const newItem = document.createElement('li');
        newItem.innerHTML = `<strong>${escapeHtml(username)}</strong> ${emotionType} на ${timeStr}`;
        list.prepend(newItem);
        if (list.children.length > 50) list.removeChild(list.lastChild);
    }

    async function loadEmotions() {
        try {
            const response = await fetch(`/api/emotions?episode_id=${episodeId}`);
            const emotions = await response.json();
            const list = document.getElementById('emotion-list');
            list.innerHTML = ''; // очищаем
            if (emotions.length === 0) {
                list.innerHTML = '<li>Пока нет эмоций. Будьте первым!</li>';
                return;
            }
            list.innerHTML = emotions.map(e => {
                const minutes = Math.floor(e.timestamp_sec / 60);
                const seconds = e.timestamp_sec % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                return `<li><strong>${escapeHtml(e.username)}</strong> ${e.emotion_type} на ${timeStr}</li>`;
            }).join('');
        } catch(err) {
            console.error('Ошибка загрузки эмоций:', err);
        }
    }

    // --- Отправка эмоции ---
    async function sendEmotion(emotionType) {
        console.log("sendEmotion called with", emotionType);
        const currentTime = player.currentTime();
        const timestamp = Math.floor(currentTime);

        if (ws && ws.readyState === WebSocket.OPEN) {
            const message = JSON.stringify({
                type: 'emotion',
                episode_id: episodeId,
                timestamp_sec: timestamp,
                emotion_type: emotionType
            });
            console.log("Sending via WS:", message);
            ws.send(message);
        } else {
            console.log("WebSocket not open, fallback to HTTP");
            try {
                const response = await fetch('/api/emotion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episode_id: episodeId,
                        timestamp_sec: timestamp,
                        emotion_type: emotionType
                    })
                });
                if (response.ok) loadEmotions();
                else alert('Ошибка: не авторизованы');
            } catch(err) {
                console.error(err);
            }
        }
        // Анимация кнопки
        const btn = document.querySelector(`.emotion-btn[data-emotion="${emotionType}"]`);
        if (btn) btn.style.transform = 'scale(1.2)';
        setTimeout(() => { if(btn) btn.style.transform = ''; }, 200);
    }

    // --- График эмоций ---
    let currentStats = [];

    async function loadStats() {
        try {
            const response = await fetch(`/api/emotions/stats?episode_id=${episodeId}`);
            if (!response.ok) throw new Error('Stats API error');
            const stats = await response.json();
            currentStats = stats;
            drawChart(stats);
        } catch(err) {
            console.error('Ошибка загрузки статистики:', err);
        }
    }

    // Канвас растягивается на всю ширину контейнера и адаптируется под devicePixelRatio,
    // чтобы график оставался чётким на мобильных/retina экранах
    function resizeCanvas(canvas) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawChart(stats) {
    const canvas = document.getElementById('emotionChart');
    if (!canvas) return;
    resizeCanvas(canvas);
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;
    ctx.clearRect(0, 0, width, height);

    if (!stats || stats.length === 0) {
        ctx.fillStyle = '#aaa';
        ctx.font = '14px sans-serif';
        ctx.fillText('Нет эмоций', width/2-40, height/2);
        canvas.onclick = null;
        return;
    }

    const maxCount = Math.max(...stats.map(s => s.count), 1);
    const barWidth = (width / stats.length) * 0.8;
    const barSpacing = (width / stats.length) * 0.2;

    stats.forEach((stat, i) => {
        const barHeight = (stat.count / maxCount) * (height - 30);
        const x = i * (barWidth + barSpacing) + barSpacing/2;
        const y = height - barHeight - 10;
        ctx.fillStyle = '#d82d7e';
        ctx.fillRect(x, y, barWidth, barHeight);

        const minutes = Math.floor(stat.interval_start / 60);
        const seconds = stat.interval_start % 60;
        const label = `${minutes}:${seconds.toString().padStart(2,'0')}`;
        ctx.fillStyle = '#ccc';
        ctx.font = '10px sans-serif';
        ctx.fillText(label, x+2, height-2);
    });

    // Добавляем обработчик клика по канвасу
    canvas.onclick = function(e) {
        const rect = canvas.getBoundingClientRect();
        let mouseX = e.clientX - rect.left;
        if (mouseX < 0) mouseX = 0;
        if (mouseX > rect.width) mouseX = rect.width;
        const index = Math.floor(mouseX / (rect.width / stats.length));
        if (index >= 0 && index < stats.length) {
            const targetTime = stats[index].interval_start;
            player.currentTime(targetTime);
            player.play();
            // Небольшая визуальная обратная связь (подсветка столбца)
            stats.forEach((stat, i) => {
                const barHeight = (stat.count / maxCount) * (height - 30);
                const x = i * (barWidth + barSpacing) + barSpacing/2;
                const y = height - barHeight - 10;
                ctx.fillStyle = (i === index) ? '#ff5fa8' : '#d82d7e';
                ctx.fillRect(x, y, barWidth, barHeight);
            });
            setTimeout(() => drawChart(stats), 200); // перерисовать нормально
        }
    };
}

    // Перерисовываем график при изменении размера окна (смена ориентации/ресайз)
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => drawChart(currentStats), 150);
    });

    // --- Пагинация комментариев ---
    let currentPage = 1;
    const pageSize = 10;

    async function loadComments() {
        try {
            const response = await fetch(`/api/comments?episode_id=${episodeId}&page=${currentPage}&pageSize=${pageSize}`);
            const comments = await response.json();
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            if (comments.length === 0) {
                list.innerHTML = '<li>Пока нет комментариев. Будьте первым!</li>';
                return;
            }
            list.innerHTML = comments.map(c => {
                const minutes = Math.floor(c.timestamp_sec / 60);
                const seconds = c.timestamp_sec % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                return `<li><strong>${escapeHtml(c.username)}</strong> [${timeStr}]: ${escapeHtml(c.text)}</li>`;
            }).join('');
            document.getElementById('currentPage').innerText = currentPage;
        } catch(err) {
            console.error('Ошибка загрузки комментариев:', err);
        }
    }

    // Отправка комментария
    document.getElementById('sendCommentBtn').onclick = async () => {
        const text = document.getElementById('commentText').value.trim();
        if (!text) return;
        const timestamp = Math.floor(player.currentTime());
        try {
            const response = await fetch('/api/comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    episode_id: episodeId,
                    timestamp_sec: timestamp,
                    text: text
                })
            });
            if (response.ok) {
                document.getElementById('commentText').value = '';
                loadComments();
            } else {
                const errData = await response.json();
                alert('Ошибка: ' + (errData.error || 'неизвестная ошибка'));
            }
        } catch(err) {
            console.error(err);
            alert('Ошибка при отправке комментария');
        }
    };

    document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            loadComments();
        }
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++;
        loadComments();
    });

    let saveInterval = null;
    let lastSavedTimestamp = 0;

    async function saveProgress() {
    const currentTime = Math.floor(player.currentTime());
    console.log("saveProgress called, currentTime:", currentTime, "lastSaved:", lastSavedTimestamp);
    if (Math.abs(currentTime - lastSavedTimestamp) < 2) return;
    lastSavedTimestamp = currentTime;
    try {
        const response = await fetch('/api/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                episode_id: episodeId,
                timestamp_sec: currentTime
            })
        });
        console.log("Progress saved response:", response.status);
    } catch(err) {
        console.error("Failed to save progress:", err);
    }
}

    // Сохраняем прогресс каждые 5 секунд
    saveInterval = setInterval(() => {
    console.log("Interval tick");
    saveProgress();
    }, 5000);

    // Сохраняем при паузе (если пользователь остановил)
    player.on('pause', saveProgress);
    // Сохраняем перед закрытием страницы (не всегда срабатывает, но полезно)
    window.addEventListener('beforeunload', saveProgress);

    let savedTimestamp = 0;

    async function loadProgress() {
    try {
        console.log("loadProgress called for episode", episodeId);
        const response = await fetch(`/api/progress?episode_id=${episodeId}`);
        const data = await response.json();
        console.log("Progress API response:", data);
        savedTimestamp = data.timestamp_sec || 0;
        if (savedTimestamp > 0) {
            // Ждём загрузки метаданных видео
            if (player.readyState() === 0) {
                console.log("Waiting for loadedmetadata");
                await new Promise(resolve => player.one('loadedmetadata', resolve));
            }
            const duration = player.duration();
            console.log("Duration:", duration, "savedTimestamp:", savedTimestamp);
            if (duration && savedTimestamp < duration - 5) {
                const minutes = Math.floor(savedTimestamp / 60);
                const seconds = savedTimestamp % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                document.getElementById('resumeTime').innerText = timeStr;
                const dialog = document.getElementById('resumeDialog');
                if (!dialog) {
                    console.error("resumeDialog element not found");
                    return;
                }
                dialog.style.display = 'block';

                // Обработчики кнопок (удаляем старые через clone)
                const resumeBtn = document.getElementById('resumeBtn');
                const restartBtn = document.getElementById('restartBtn');
                if (!resumeBtn || !restartBtn) {
                    console.error("Buttons not found");
                    return;
                }
                const newResumeBtn = resumeBtn.cloneNode(true);
                const newRestartBtn = restartBtn.cloneNode(true);
                resumeBtn.parentNode.replaceChild(newResumeBtn, resumeBtn);
                restartBtn.parentNode.replaceChild(newRestartBtn, restartBtn);

                newResumeBtn.addEventListener('click', () => {
                    console.log("Resume clicked, setting time to", savedTimestamp);
                    player.currentTime(savedTimestamp);
                    player.play();
                    dialog.style.display = 'none';
                });
                newRestartBtn.addEventListener('click', async () => {
                    console.log("Restart clicked, deleting progress");
                    await fetch('/api/progress', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ episode_id: episodeId })
                    });
                    dialog.style.display = 'none';
                    player.currentTime(0);
                    player.play();
                });
            } else {
                console.log("Saved timestamp is near the end, starting from 0");
                player.currentTime(0);
            }
        } else {
            console.log("No saved progress");
        }
    } catch(err) {
        console.error("Failed to load progress:", err);
    }
}

    // --- Вспомогательные ---
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // --- Навешиваем обработчики на кнопки эмоций ---
    document.querySelectorAll('.emotion-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const emotion = btn.getAttribute('data-emotion');
            sendEmotion(emotion);
        });
    });

    // --- Отображение текущего времени ---
    setInterval(() => {
        const t = player.currentTime();
        const minutes = Math.floor(t / 60);
        const seconds = Math.floor(t % 60);
        const display = document.getElementById('currentTimeDisplay');
        if (display) display.innerText = `${minutes}:${seconds.toString().padStart(2,'0')}`;
    }, 500);

    // --- Инициализация ---
    player.ready(() => {
    loadProgress();
    loadEmotions();
    connectWebSocket();
    loadStats();
    loadComments();
    });
</script>
{{template "footer" .}}
</body>
</html>
