<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ancen - просмотр</title>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background: #1a1a2e; color: #eee; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .emotion-buttons { margin: 20px 0; }
        .emotion-buttons button { font-size: 2rem; margin: 0 5px; cursor: pointer; background: #2a2a3e; border: none; border-radius: 10px; padding: 10px; transition: transform 0.1s; }
        .emotion-buttons button:hover { transform: scale(1.1); background: #3a3a4e; }
        #emotion-list { list-style: none; padding: 0; }
        #emotion-list li { padding: 5px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
<div class="container">
        <nav>
        <a href="/">Главная</a>
        <form method="GET" action="/search" style="display: inline-block;">
            <input type="text" name="q" placeholder="Поиск...">
            <button type="submit">🔍</button>
        </form>
        <a href="/profile">Профиль</a>
        <a href="/logout">Выход</a>
    </nav>
    <hr>
    <h2>Эпизод {{.EpisodeNum}}</h2>

    <div id="resumeDialog" style="display: none; background: #2a2a3e; border: 2px solid #ffaa44; border-radius: 12px; padding: 15px; margin: 10px 0; text-align: center;">
    <p>У вас есть сохранённый прогресс: <span id="resumeTime">0:00</span></p>
    <button id="resumeBtn" style="margin-right: 10px;">Продолжить</button>
    <button id="restartBtn">Начать сначала</button>
    </div>

    <!-- Видеоплеер -->
    <video
        id="my-video"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
        width="640"
        height="360"
        data-setup="{}">
        <source src="{{.VideoURL}}" type="video/mp4">
        <p class="vjs-no-js">Для просмотра видео включите JavaScript</p>
    </video>

    <!-- Кнопки эмоций -->
    <div class="emotion-buttons">
        <button class="emotion-btn" data-emotion="😭">😭</button>
        <button class="emotion-btn" data-emotion="🔥">🔥</button>
        <button class="emotion-btn" data-emotion="🤯">🤯</button>
        <button class="emotion-btn" data-emotion="🥰">🥰</button>
        <button class="emotion-btn" data-emotion="💢">💢</button>
    </div>

    <div id="resumeDialog" style="display: none; background: #2a2a3e; border: 2px solid #ffaa44; border-radius: 12px; padding: 15px; margin: 10px 0; text-align: center;">
    <p>У вас есть сохранённый прогресс: <span id="resumeTime">0:00</span></p>
    <button id="resumeBtn" style="margin-right: 10px;">Продолжить</button>
    <button id="restartBtn">Начать сначала</button>
</div>

    <canvas id="emotionChart" width="640" height="150" style="background: #2a2a3e; border-radius: 8px; margin: 10px 0;"></canvas>

    <h3>Эмоции зрителей:</h3>
    <ul id="emotion-list">
        <li>Загрузка...</li>
    </ul>

    <h3>Комментарии к таймкодам</h3>
    <div>
        <input type="text" id="commentText" placeholder="Ваш комментарий" style="width: 70%;">
        <button id="sendCommentBtn">Отправить</button>
        <span>Таймкод: <span id="currentTimeDisplay">0:00</span></span>
    </div>
    <ul id="comments-list">
        <li>Загрузка...</li>
    </ul>
</div>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    var player = videojs('my-video');
    
    // Получаем ID эпизода из URL
    const urlParams = new URLSearchParams(window.location.search);
    let episodeId = parseInt(urlParams.get('episode'));
    if (isNaN(episodeId)) episodeId = 1;

    let ws;

    // --- WebSocket ---
    function connectWebSocket() {
        ws = new WebSocket(`ws://localhost:8080/ws?episode_id=${episodeId}`);
        ws.onopen = function() {
            console.log("✅ WebSocket connected for episode", episodeId);
        };
        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'emotion') {
                addEmotionToList(msg.username, msg.emotion_type, msg.timestamp_sec);
                loadStats();   // обновить график
            }
        };
        ws.onclose = function() {
            console.log("🔌 WebSocket closed, reconnecting in 3s...");
            setTimeout(connectWebSocket, 3000);
        };
        ws.onerror = function(err) {
            console.error("❌ WebSocket error", err);
        };
    }

    // --- Лента эмоций ---
    function addEmotionToList(username, emotionType, timestampSec) {
        const list = document.getElementById('emotion-list');
        // Убираем заглушку "Пока нет эмоций", если она есть
        if (list.children.length === 1 && list.children[0].innerText.includes('Пока нет эмоций')) {
            list.innerHTML = '';
        }
        const minutes = Math.floor(timestampSec / 60);
        const seconds = timestampSec % 60;
        const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
        const newItem = document.createElement('li');
        newItem.innerHTML = `<strong>${escapeHtml(username)}</strong> ${emotionType} на ${timeStr}`;
        list.prepend(newItem);
        if (list.children.length > 50) list.removeChild(list.lastChild);
    }

    async function loadEmotions() {
        try {
            const response = await fetch(`/api/emotions?episode_id=${episodeId}`);
            const emotions = await response.json();
            const list = document.getElementById('emotion-list');
            list.innerHTML = ''; // очищаем
            if (emotions.length === 0) {
                list.innerHTML = '<li>Пока нет эмоций. Будьте первым!</li>';
                return;
            }
            list.innerHTML = emotions.map(e => {
                const minutes = Math.floor(e.timestamp_sec / 60);
                const seconds = e.timestamp_sec % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                return `<li><strong>${escapeHtml(e.username)}</strong> ${e.emotion_type} на ${timeStr}</li>`;
            }).join('');
        } catch(err) {
            console.error('Ошибка загрузки эмоций:', err);
        }
    }

    // --- Отправка эмоции ---
    async function sendEmotion(emotionType) {
        console.log("sendEmotion called with", emotionType);
        const currentTime = player.currentTime();
        const timestamp = Math.floor(currentTime);
        
        if (ws && ws.readyState === WebSocket.OPEN) {
            const message = JSON.stringify({
                type: 'emotion',
                episode_id: episodeId,
                timestamp_sec: timestamp,
                emotion_type: emotionType
            });
            console.log("Sending via WS:", message);
            ws.send(message);
        } else {
            console.log("WebSocket not open, fallback to HTTP");
            try {
                const response = await fetch('/api/emotion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episode_id: episodeId,
                        timestamp_sec: timestamp,
                        emotion_type: emotionType
                    })
                });
                if (response.ok) loadEmotions();
                else alert('Ошибка: не авторизованы');
            } catch(err) {
                console.error(err);
            }
        }
        // Анимация кнопки
        const btn = document.querySelector(`.emotion-btn[data-emotion="${emotionType}"]`);
        if (btn) btn.style.transform = 'scale(1.2)';
        setTimeout(() => { if(btn) btn.style.transform = ''; }, 200);
    }

    // --- График эмоций ---
    let currentStats = [];

    async function loadStats() {
        try {
            const response = await fetch(`/api/emotions/stats?episode_id=${episodeId}`);
            if (!response.ok) throw new Error('Stats API error');
            const stats = await response.json();
            currentStats = stats;
            drawChart(stats);
        } catch(err) {
            console.error('Ошибка загрузки статистики:', err);
        }
    }

    function drawChart(stats) {
    const canvas = document.getElementById('emotionChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    ctx.clearRect(0, 0, width, height);
    
    if (!stats || stats.length === 0) {
        ctx.fillStyle = '#aaa';
        ctx.font = '14px sans-serif';
        ctx.fillText('Нет эмоций', width/2-40, height/2);
        canvas.onclick = null;
        return;
    }
    
    const maxCount = Math.max(...stats.map(s => s.count), 1);
    const barWidth = (width / stats.length) * 0.8;
    const barSpacing = (width / stats.length) * 0.2;
    
    stats.forEach((stat, i) => {
        const barHeight = (stat.count / maxCount) * (height - 30);
        const x = i * (barWidth + barSpacing) + barSpacing/2;
        const y = height - barHeight - 10;
        ctx.fillStyle = '#ffaa44';
        ctx.fillRect(x, y, barWidth, barHeight);
        
        const minutes = Math.floor(stat.interval_start / 60);
        const seconds = stat.interval_start % 60;
        const label = `${minutes}:${seconds.toString().padStart(2,'0')}`;
        ctx.fillStyle = '#ccc';
        ctx.font = '10px sans-serif';
        ctx.fillText(label, x+2, height-2);
    });
    
    // Добавляем обработчик клика по канвасу
    canvas.onclick = function(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;   // учитываем фактический размер canvas
        let mouseX = (e.clientX - rect.left) * scaleX;
        if (mouseX < 0) mouseX = 0;
        if (mouseX > canvas.width) mouseX = canvas.width;
        const index = Math.floor(mouseX / (canvas.width / stats.length));
        if (index >= 0 && index < stats.length) {
            const targetTime = stats[index].interval_start;
            player.currentTime(targetTime);
            player.play();
            // Небольшая визуальная обратная связь (подсветка столбца)
            ctx.fillStyle = '#ffaa44';
            stats.forEach((stat, i) => {
                const barHeight = (stat.count / maxCount) * (height - 30);
                const x = i * (barWidth + barSpacing) + barSpacing/2;
                const y = height - barHeight - 10;
                if (i === index) ctx.fillStyle = '#ff8844';
                else ctx.fillStyle = '#ffaa44';
                ctx.fillRect(x, y, barWidth, barHeight);
            });
            setTimeout(() => drawChart(stats), 200); // перерисовать нормально
        }
    };
}

    // --- Комментарии ---
    async function loadComments() {
        try {
            const response = await fetch(`/api/comments?episode_id=${episodeId}`);
            const comments = await response.json();
            const list = document.getElementById('comments-list');
            list.innerHTML = ''; // очищаем
            if (comments.length === 0) {
                list.innerHTML = '<li>Пока нет комментариев. Будьте первым!</li>';
                return;
            }
            list.innerHTML = comments.map(c => {
                const minutes = Math.floor(c.timestamp_sec / 60);
                const seconds = c.timestamp_sec % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                return `<li><strong>${escapeHtml(c.username)}</strong> [${timeStr}]: ${escapeHtml(c.text)}</li>`;
            }).join('');
        } catch(err) {
            console.error('Ошибка загрузки комментариев:', err);
        }
    }

    // Отправка комментария
    document.getElementById('sendCommentBtn').onclick = async () => {
        const text = document.getElementById('commentText').value.trim();
        if (!text) return;
        const timestamp = Math.floor(player.currentTime());
        try {
            const response = await fetch('/api/comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    episode_id: episodeId,
                    timestamp_sec: timestamp,
                    text: text
                })
            });
            if (response.ok) {
                document.getElementById('commentText').value = '';
                loadComments();
            } else {
                const errData = await response.json();
                alert('Ошибка: ' + (errData.error || 'неизвестная ошибка'));
            }
        } catch(err) {
            console.error(err);
            alert('Ошибка при отправке комментария');
        }
    };

    let saveInterval = null;
    let lastSavedTimestamp = 0;

    async function saveProgress() {
    const currentTime = Math.floor(player.currentTime());
    console.log("saveProgress called, currentTime:", currentTime, "lastSaved:", lastSavedTimestamp);
    if (Math.abs(currentTime - lastSavedTimestamp) < 2) return;
    lastSavedTimestamp = currentTime;
    try {
        const response = await fetch('/api/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                episode_id: episodeId,
                timestamp_sec: currentTime
            })
        });
        console.log("Progress saved response:", response.status);
    } catch(err) {
        console.error("Failed to save progress:", err);
    }
}

    // Сохраняем прогресс каждые 5 секунд
    saveInterval = setInterval(() => {
    console.log("Interval tick");
    saveProgress();
    }, 5000);

    // Сохраняем при паузе (если пользователь остановил)
    player.on('pause', saveProgress);
    // Сохраняем перед закрытием страницы (не всегда срабатывает, но полезно)
    window.addEventListener('beforeunload', saveProgress);

    let savedTimestamp = 0;

    async function loadProgress() {
    try {
        console.log("loadProgress called for episode", episodeId);
        const response = await fetch(`/api/progress?episode_id=${episodeId}`);
        const data = await response.json();
        console.log("Progress API response:", data);
        savedTimestamp = data.timestamp_sec || 0;
        if (savedTimestamp > 0) {
            // Ждём загрузки метаданных видео
            if (player.readyState() === 0) {
                console.log("Waiting for loadedmetadata");
                await new Promise(resolve => player.one('loadedmetadata', resolve));
            }
            const duration = player.duration();
            console.log("Duration:", duration, "savedTimestamp:", savedTimestamp);
            if (duration && savedTimestamp < duration - 5) {
                const minutes = Math.floor(savedTimestamp / 60);
                const seconds = savedTimestamp % 60;
                const timeStr = `${minutes}:${seconds.toString().padStart(2,'0')}`;
                document.getElementById('resumeTime').innerText = timeStr;
                const dialog = document.getElementById('resumeDialog');
                if (!dialog) {
                    console.error("resumeDialog element not found");
                    return;
                }
                dialog.style.display = 'block';

                // Обработчики кнопок (удаляем старые через clone)
                const resumeBtn = document.getElementById('resumeBtn');
                const restartBtn = document.getElementById('restartBtn');
                if (!resumeBtn || !restartBtn) {
                    console.error("Buttons not found");
                    return;
                }
                const newResumeBtn = resumeBtn.cloneNode(true);
                const newRestartBtn = restartBtn.cloneNode(true);
                resumeBtn.parentNode.replaceChild(newResumeBtn, resumeBtn);
                restartBtn.parentNode.replaceChild(newRestartBtn, restartBtn);

                newResumeBtn.addEventListener('click', () => {
                    console.log("Resume clicked, setting time to", savedTimestamp);
                    player.currentTime(savedTimestamp);
                    player.play();
                    dialog.style.display = 'none';
                });
                newRestartBtn.addEventListener('click', async () => {
                    console.log("Restart clicked, deleting progress");
                    await fetch('/api/progress', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ episode_id: episodeId })
                    });
                    dialog.style.display = 'none';
                    player.currentTime(0);
                    player.play();
                });
            } else {
                console.log("Saved timestamp is near the end, starting from 0");
                player.currentTime(0);
            }
        } else {
            console.log("No saved progress");
        }
    } catch(err) {
        console.error("Failed to load progress:", err);
    }
}

    // --- Вспомогательные ---
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // --- Навешиваем обработчики на кнопки эмоций ---
    document.querySelectorAll('.emotion-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const emotion = btn.getAttribute('data-emotion');
            sendEmotion(emotion);
        });
    });

    // --- Отображение текущего времени ---
    setInterval(() => {
        const t = player.currentTime();
        const minutes = Math.floor(t / 60);
        const seconds = Math.floor(t % 60);
        const display = document.getElementById('currentTimeDisplay');
        if (display) display.innerText = `${minutes}:${seconds.toString().padStart(2,'0')}`;
    }, 500);

    // --- Инициализация ---
    player.ready(() => {
    loadProgress();
    loadEmotions();
    connectWebSocket();
    loadStats();
    loadComments();
    });
</script>
</body>
</html>
