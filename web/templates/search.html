<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Поиск — Ancen</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <nav>
        <a href="/">Главная</a>
        <form method="GET" action="/search" style="display: inline-block;">
            <input type="text" name="q" placeholder="Поиск..." value="{{.Query}}">
            <button type="submit">🔍</button>
        </form>
        <a href="/profile">Профиль</a>
        <a href="/logout">Выход</a>
    </nav>
    <hr>
    <h1>Поиск аниме</h1>
    <!-- остальное без изменений, но можно оставить и дополнительную форму -->
    <form method="GET" action="/search">
        <input type="text" name="q" placeholder="Название, жанр, описание..." value="{{.Query}}" style="width: 70%;">
        <button type="submit">Найти</button>
    </form>
    {{if .Query}}
        <h2>Результаты по запросу «{{.Query}}»</h2>
        {{if .Results}}
            <div class="anime-grid">
            {{range .Results}}
                <div class="anime-card">
                    <a href="/anime/{{.ID}}">
                        <img src="{{.Poster}}" alt="{{.Title}}" class="anime-poster">
                        <h3>{{.Title}}</h3>
                        <p>{{.Genres}}</p>
                    </a>
                </div>
            {{end}}
            </div>
        {{else}}
            <p>Ничего не найдено.</p>
        {{end}}
    {{end}}
</div>
<script>
    // --- Пагинация поиска ---
    let currentPage = 1;
    const pageSize = 25; // Количество результатов на странице

    function updateSearchResults() {
        const query = document.querySelector('input[name="q"]').value.trim();
        fetch(`/search?q=${query}&page=${currentPage}&pageSize=${pageSize}`)
            .then(response => response.text())
            .then(html => {
                // Заменяем только результаты поиска, а не всю страницу
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const results = doc.querySelector('.anime-grid');
                const pagination = doc.getElementById('pagination');
                if (results) {
                    document.querySelector('.anime-grid').innerHTML = results.innerHTML;
                } else {
                    document.querySelector('.anime-grid').innerHTML = '<p>Ничего не найдено.</p>';
                }
                if (pagination) {
                    document.getElementById('pagination').innerHTML = pagination.innerHTML;
                }
                // Обновляем обработчики событий для кнопок пагинации
                setupPagination();
            })
            .catch(err => console.error('Ошибка загрузки результатов поиска:', err));
    }

    function setupPagination() {
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updateSearchResults();
                document.getElementById('currentPage').innerText = currentPage;
            }
        });

        document.getElementById('nextPageBtn').addEventListener('click', () => {
            currentPage++;
            updateSearchResults();
            document.getElementById('currentPage').innerText = currentPage;
        });
    }

    setupPagination();
</script>
{{template "footer" .}}
</body>
</html>
