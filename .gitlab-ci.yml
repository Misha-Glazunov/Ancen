stages:
  - test
  - deploy

test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Раннер для деплоя — специально зарегистрированный self-hosted GitLab Runner
# на Windows-сервере (тег ancen-windows), не shared-раннер. GitHub-репозиторий
# зеркалируется в этот GitLab-проект pull-mirror'ом; исходный код и issues/PR
# остаются на GitHub, GitLab используется только как CI/CD-движок.
deploy:
  stage: deploy
  tags:
    - ancen-windows
  script:
    # Раннер чекаутит код в чистую build-директорию (git clean -ffdx перед каждым
    # job'ом стирает всё untracked, включая deploy/mysql/data и deploy/minio/data,
    # если они там появятся) — .env тоже в .gitignore, поэтому секреты и
    # MYSQL_DATA_DIR/MINIO_DATA_DIR (обязаны указывать на постоянный путь ВНЕ
    # build-директории, иначе БД стирается на каждом деплое) остаются в постоянной
    # рабочей копии на сервере, забираем их оттуда.
    - Copy-Item "C:\Users\mishg\Desktop\Ancen\.env" ".env" -Force
    - Copy-Item "C:\Users\mishg\Desktop\Ancen\deploy\mysql\.env" "deploy\mysql\.env" -Force
    - Copy-Item "C:\Users\mishg\Desktop\Ancen\deploy\minio\.env" "deploy\minio\.env" -Force
    - docker build -t ancen-app:latest .
    - docker compose up -d
    - docker restart ancen-nginx-1
    - docker image prune -f
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test
